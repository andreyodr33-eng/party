}
 .top-panel{
    flex-shrink:0;
 }

.card{
    position:relative;

    border-radius:12px;

 }
.card:hover {
     background: #fff59d;

  .word{
        font-size:20px;

        color:#1976d2;
    }  

.translation{

     color:black;
}

.delete-btn{
    position:absolute;

    background:none;
    color:#c62828;
    font-size:18px;
    cursor:pointer;
    padding:0;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s;  
}
@media (hover: hover) {    
.card:hover .delete-btn{
    opacity:1;
    pointer-events:auto;
 }
}
.delete-btn:hover{
    background:none;
    
}

@media (max-width:600px){

    body{
        padding:10px;
    }

       .translation{
        font-size:20px;
       
    }
 }
   .actions{
        display:flex;
        gap:10px;
        margin-top:10px;
 }
   #topic{
       flex:1;
       display:none;
 }
   #addBtn{
       flex:0 0 70px;
  }
 .topic-button{

    width:100%;
    box-sizing:border-box;

    padding:12px;

    border:1px solid #ccc;

    border-radius:10px;

    background:white;

    cursor:pointer;

    user-select:none;

}   
.input-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.input-row input{
    flex:1;
}

.input-row button{
    flex:0 0 70px;
}
.card-text{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:10px;
    padding-right:30px;
}
 .card-text{
     line-height:1.1;
 }    

#backupPanel{
    margin-top:20px;
}

.backup-buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.backup-buttons button{
    flex:1;
}   
.support-modal{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.6);

    z-index:9999;

    justify-content:center;

    align-items:center;

}

.support-box{

    background:white;

    padding:20px;

    border-radius:12px;

    max-width:320px;

    text-align:center;

}

.support-box button{

    width:100%;

    margin-top:10px;

    padding:12px;

    border:none;

}
 .topic-menu{

    top:100%;

}    
.topic-wrapper{

}    

.topic-item{

}

.topic-item:hover{

    background:#f5f5f5;

}   
 .menu-btn{

    position:absolute;
    width:auto !important;
    height:auto !important;
    padding:0 !important; 
    bottom:10px;
    right:10px;

    border:none;

    cursor:pointer;

  

}   
 .menu-btn:hover{
    color:#1565c0;
}
   
#splash{

    position:fixed;

}

#splash img{

}

#splash h2{

    margin-top:15px;

}

    -webkit-overflow-scrolling: touch;
}

</head>
<body>

<div id="splash">

    <img
        src="icon-192.png"
        alt="Logo">

    <h2>
        WordBook
    </h2>

</div>
<div class="container">
  <div class="top-panel">
  <div class="form">
  </div>
        <div class="input-row">

    <input
        id="leftWord"
        placeholder="Word">

    <button
        id="lang1Btn"
        type="button">
        RU
    </button>

</div>

        <div class="input-row">

    <input
        id="rightWord"
        placeholder="Word">

    <button
        id="lang2Btn"
        type="button">
        EN
    </button>

</div>
    <div class="actions">
        <div class="topic-wrapper">
         <div id="topicButton" class="topic-button">
         Hospital  ▼
     </div> 
    <div id="topicMenu" class="topic-menu">

         <div class="topic-item">Housing</div>
         <div class="topic-item">Help</div>
         <div class="topic-item">Food</div>
         <div class="topic-item">Shopping</div>
         <div class="topic-item">Work</div>
         <div class="topic-item">Transport</div>
         <div class="topic-item">Conversation</div>
    </div>
   </div>
        <button id="addBtn">
            Add
        </button>

  </div>
 </div>
     <div id="cards"></div>

     <details id="backupPanel">

    <summary>
        Backup & Restore
    </summary>

    <div class="backup-buttons">

        <button id="exportBtn">
            Export
        </button>

        <button id="importBtn">
            Import
        </button>

        <input 
           type="file"
           id="importFile"
           accept=".json"
           style="display:none">

    </div>

</details>
 
</div>

<script>
let insertBelowId = null; 
let insertBelowOrder = null;   
if (!localStorage.getItem("installDate")) {
    localStorage.setItem(
        "installDate",
        Date.now()
    );
}

let db;

let lang1Index =
    Number(
        localStorage.getItem("lang1Index")
    );

let lang2Index =
    Number(
        localStorage.getItem("lang2Index")
    );

if (isNaN(lang1Index)) {
    lang1Index = 1; // RU
}

if (isNaN(lang2Index)) {
    lang2Index = 0; // EN
}
let currentTopic = 
    localStorage.getItem("currentTopic")
    ||"Housing";
const languages = [
    {
        name: "English",
        code: "en-US",
        short: "EN"
    },
    {
        name: "Russian",
        code: "ru-RU",
        short: "RU"
    },
    {
        name: "Portuguese",
        code: "pt-PT",
        short: "PT"
    },
    {
        name: "Spanish",
        code: "es-ES",
        short: "ES"
    },
    {
        name: "German",
        code: "de-DE",
        short: "DE"
    },
    {
        name: "French",
        code: "fr-FR",
        short: "FR"
    }
];

const request = indexedDB.open("EnglishNotebook", 1);

request.onupgradeneeded = function(event) {

    db = event.target.result;

    if (!db.objectStoreNames.contains("words")) {

        const store = db.createObjectStore("words", {
            keyPath: "id",
            autoIncrement: true
        });

        store.createIndex("topic", "topic", {
            unique: false
        });
    }
};

request.onsuccess = function(event) {

    db = event.target.result;

    document
    .getElementById("topicButton")
    .textContent =
        currentTopic + " ▼";

    showWords(currentTopic);

};

request.onerror = function(error) {
    console.error("IndexedDB error:", error);
};

document
.getElementById("addBtn")
.addEventListener("click", addWord);

document
.getElementById("exportBtn")
.addEventListener(
    "click",
    exportData
);
document
.getElementById("importBtn")
.addEventListener(
    "click",
    () => {
        document
            .getElementById("importFile")
            .click();
    }
);

document
.getElementById("lang1Btn")
.textContent =
languages[lang1Index].short;

document
.getElementById("lang2Btn")
.textContent =
languages[lang2Index].short;

 function addWord() {

    const left =
        document.getElementById("leftWord")
        .value
        .trim();

    const right =
        document.getElementById("rightWord")
        .value
        .trim();

    const topic =
        currentTopic;

    if (!left || !right) return;

    const tx =
        db.transaction(
            "words",
            "readwrite"
        );

    const store =
        tx.objectStore("words");
    
    store.getAll().onsuccess = (e) => {

    const allWords = e.target.result;

   let minOrder = 0;

    allWords.forEach(word => {

       const order =
           word.order || word.id * 100;

    if (
        minOrder === 0 ||
        order < minOrder
    ) {

        minOrder = order;

    }

});
let newOrder;

if (insertBelowOrder !== null) {

    const nextWord =
        allWords
            .filter(
                w =>
                (w.order || w.id * 100) >
                insertBelowOrder
            )
            .sort(
                (a,b) =>
                (a.order || a.id * 100) -
                (b.order || b.id * 100)
            )[0];

    if (nextWord) {

        const nextOrder =
            nextWord.order ||
            nextWord.id * 100;

        newOrder =
            (insertBelowOrder +
             nextOrder) / 2;

    } else {

        newOrder =
            insertBelowOrder + 100;

    }

} else {

    newOrder =
        minOrder - 100;

}
    
store.add({
    left,
    right,
    topic,
    lang1: languages[lang1Index].code,
    lang2: languages[lang2Index].code,

    order: newOrder
});

insertBelowId = null;
insertBelowOrder = null;
};
    
      tx.oncomplete = () => {

        document.getElementById("leftWord").value = "";
        document.getElementById("rightWord").value = "";

        document.getElementById("leftWord").focus();

        showWords(currentTopic);
    };
}

function showWords(topic) {

    const tx =
        db.transaction(
            "words",
            "readonly"
        );

    const store =
        tx.objectStore("words");

    const req =
        store.getAll();

    req.onsuccess = function() {

        const cards =
            document.getElementById("cards");

        cards.innerHTML = "";

        const currentLang1 =
            languages[lang1Index].code;

        const currentLang2 =
            languages[lang2Index].code;

        const words = req.result.filter(word =>
            word.topic === topic &&
            word.lang1 === currentLang1 &&
            word.lang2 === currentLang2
    );
        words.sort(
            (a,b)=>
                (a.order || a.id) -
                (b.order || b.id)
     );        

        words.forEach(item => {

            const card =
                document.createElement("div");

            let startX = 0;
            let currentX = 0;
            let deleteMode = false;
            let cardOpened = false;
                       
            card.addEventListener(
            "touchstart",
            (e)=>{

            startX =
            e.touches[0].clientX;
          // test      
            window.startY =
                e.touches[0].clientY;
        }
      );
           card.addEventListener(
          "touchmove",
           (e)=>{
            // test
           const cards =
                document.getElementById("cards");

            const deltaY =
                e.touches[0].clientY -
                (window.startY || e.touches[0].clientY);

            if (
                cards.scrollTop <= 0 &&
                deltaY > 0
            ){
                e.preventDefault();
             return;
             } 

           currentX =
            e.touches[0].clientX;

           let deltaX =
                currentX - startX;
                if (deltaX < 0) {
                if (deltaX < -100) {
                    deltaX = -100;
                }   
                card.style.transform =
                    `translateX(${deltaX}px)`;
                    
                const deleteBtn =
                   card.querySelector(
                       ".delete-btn"
                 );

          if (deltaX <= -100) {

             deleteBtn.style.opacity =
                 "1";
         deleteBtn.style.pointerEvents =
               "auto";
           deleteMode = true;
         } else {

            deleteBtn.style.opacity =
                 "0";
          deleteBtn.style.pointerEvents =
              "none";
          deleteMode = false;
              }    
           }

        }
     );
            
        card.addEventListener(
        "touchend",
         ()=>{

        const deleteBtn =
            card.querySelector(
                ".delete-btn"
            );

        if (deleteMode) {
            cardOpened = true;
            
            card.style.transform =
                "translateX(-100px)";
           
            deleteBtn.style.opacity =
                "1";
        
        } else {
            cardOpened = false;
            card.style.transform =
                "translateX(0px)";

            deleteBtn.style.opacity =
                "0";

        }

    }
);
          card.addEventListener(
    "click",
    (e)=>{

        if (cardOpened) {

            e.stopPropagation();

            const deleteBtn =
                card.querySelector(
                    ".delete-btn"
                );

            card.style.transform =
                "translateX(0px)";

            deleteBtn.style.opacity =
                "0";

            cardOpened = false;

            return;
        }

    }
);  

            card.className = "card";

            card.innerHTML = `
                <button
                    class="delete-btn"
                    title="Delete">
                    &#128465;&#65039;
                </button>
                <button
                     class="menu-btn"
                     title="Insert Below">
                     ...
                </button>

                <div class="card-text">
                  <span class="word">
                      ${item.right}
                  </span>

                 <span class="translation">
                           ${item.left}
                </span>
           </div>
            `;

           card.addEventListener(
                "click",
                () => speak(
                    item.right,
                    item.lang2
            )
        );

            card.querySelector(
                ".delete-btn"
            ).addEventListener(
                "click",
                (e) => {

                    e.stopPropagation();

                    deleteWord(item.id);
                }
            );
          card.querySelector(
              ".menu-btn"
          ).addEventListener(
               "click",
               (e)=>{

                  e.stopPropagation();
                  insertBelowId = item.id;
                  insertBelowOrder =
                      item.order || item.id * 100;
                   
                  document
                       .getElementById(
                           "leftWord"
                      )
                      .focus();
      

    }
);
            cards.appendChild(card);
        });
    };
}

function deleteWord(id) {

    const tx =
        db.transaction(
            "words",
            "readwrite"
        );

    const store =
        tx.objectStore("words");

    store.delete(id);

    tx.oncomplete = () => {

        showWords(currentTopic);
    };
}

function speak(text, lang) {

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = lang;
    utterance.rate = 0.9;
    utterance.volume = 1;

    const voices =
        speechSynthesis.getVoices();

    let voice = null;

    if (lang.startsWith("en")) {
        voice =
            voices.find(v =>
                v.lang.includes("en")
            );
    }
    
    else if (lang.startsWith("es")) {
        voice =
            voices.find(v =>
                v.lang.includes("es")
            );
    }
    else if (lang.startsWith("de")) {

    voice =
        voices.find(v =>
            v.name.includes("Markus")
        );

}
    else if (lang.startsWith("fr")) {
        voice =
            voices.find(v =>
                v.lang.includes("fr")
            );
    }

    else if (lang.startsWith("pt")) {
        voice =
            voices.find(v =>
                v.lang.includes("pt")
            );
    }

    else if (lang.startsWith("ru")) {
        voice =
            voices.find(v =>
                v.lang.includes("ru")
            );
    }
       if (voice) {
        utterance.voice = voice;
    }

    speechSynthesis.speak(
        utterance
    );
}
 

// Выбор темы
document
.querySelectorAll(".topic-item")
.forEach(item => {

    item.addEventListener(
        "click",
        ()=>{

            currentTopic =
                item.textContent;
            
            localStorage.setItem(
                "currentTopic",
                currentTopic
          );
            document
            .getElementById(
                "topicButton"
            ).textContent =
                currentTopic + " ▼";

            document
            .getElementById(
                "topicMenu"
            ).style.display =
                "none";

            showWords(
                currentTopic
            );

        }
    );

});

// Переключение языка 1

document
.getElementById("lang1Btn")
.addEventListener("click", () => {

    lang1Index++;

    if (lang1Index >= languages.length) {
        lang1Index = 0;
    }

    document
        .getElementById("lang1Btn")
        .textContent =
        languages[lang1Index].short;

    localStorage.setItem(
        "lang1Index",
        lang1Index
    );

    showWords(currentTopic);
});

// Переключение языка 2

document
.getElementById("lang2Btn")
.addEventListener("click", () => {

    lang2Index++;

    if (lang2Index >= languages.length) {
        lang2Index = 0;
    }

    document
        .getElementById("lang2Btn")
        .textContent =
        languages[lang2Index].short;

    localStorage.setItem(
        "lang2Index",
        lang2Index
    );

    showWords(currentTopic);
});

function importData(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload = function(e) {

        const data =
            JSON.parse(
                e.target.result
            );

        const tx =
            db.transaction(
                "words",
                "readwrite"
            );

        const store =
            tx.objectStore("words");

        data.words.forEach(word => {

            delete word.id;

            store.add(word);
        });

        tx.oncomplete = () => {

            showWords(currentTopic);

            alert(
                "Import completed"
            );
        };
    };

    reader.readAsText(file);
}

function exportData() {

    const tx =
        db.transaction(
            "words",
            "readonly"
        );

    const store =
        tx.objectStore("words");

    const req =
        store.getAll();

    req.onsuccess = () => {

        const data = {
            words: req.result
        };

        const json =
            JSON.stringify(
                data,
                null,
                2
            );

        const blob =
            new Blob(
                [json],
                {
                    type:
                    "application/json"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "dictionary-backup.json";

        a.click();

        URL.revokeObjectURL(url);
    };
}

document
.getElementById("importFile")
.addEventListener(
    "change",
    importData
);
// Монетизация показ окна раз в месяц
    
function shouldShowSupportPopup() {

    if (localStorage.getItem("supporter") === "true") {
        return false;
    }

    const installDate =
        Number(localStorage.getItem("installDate"));

    const month = 
    30 * 24 * 60 * 60 * 1000;
    

    return (
        Date.now() - installDate
    ) > month;
}
// Монетизация
function showSupportPopup(){

    document
    .getElementById("supportModal")
    .style.display = "flex";

}
 
window.addEventListener(
    "load",
    () => {

        if (
            shouldShowSupportPopup()
        ) {
            showSupportPopup();
        }

    }
);
window.addEventListener("load", () => {

    document
    .getElementById("continueBtn")
    .addEventListener("click",()=>{

        document
        .getElementById("supportModal")
        .style.display = "none";

    });

    document
    .getElementById("supportBtn")
    .addEventListener("click",()=>{

        window.open(
            "https://send.monobank.ua/jar/AaNZCRas5s",
            "_blank"
        );

        document
        .getElementById(
            "supportBtn"
        )
        .style.display = "none";

        document
        .getElementById(
            "supportedBtn"
        )
        .style.display = "block";

    });

    document
    .getElementById("supportedBtn")
    .addEventListener(
        "click",
        ()=>{

            localStorage.setItem(
                "supporter",
                "true"
            );

            document
            .getElementById(
                "supportModal"
            )
            .style.display = "none";

        }
    );

});
         
document
.getElementById("topicButton")
.addEventListener(
    "click",
    ()=>{

        const menu =
            document.getElementById(
                "topicMenu"
            );

        if (
            menu.style.display ===
            "block"
        ){

            menu.style.display =
                "none";

        } else {

            menu.style.display =
                "block";

        }

    }
);    
//ЗАСТАВКА    
window.addEventListener(
    "load",
    ()=>{

        setTimeout(
            ()=>{

                document
                    .getElementById(
                        "splash"
                    )
                    .style.display =
                    "none";

            },

            1000

        );

    }
);
</script>
