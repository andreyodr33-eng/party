      }

      // --------------------
      // ПОКАЗ
      // --------------------

      function show() {
        hintUsed = false;
        current = getWord();

        if (!current) {
          return;
        }
        document.getElementById("hint").innerHTML = "";

        current.shown++;
        saveWord(current);
        state.lastWord = current.en;
        saveState();

        document.getElementById("word").innerText = current.en;
        document.getElementById("topicLabel").innerText = getTopicName();
        // ❗ ВАЖНО: НЕ трогаем кнопки speak и "я знаю"
        let box = document.getElementById("options");
        box.innerHTML = "";

        // ⏱ сначала озвучка
        speak();

        // ⏱ потом задержка перед вариантами
        setTimeout(() => {
          let options = getOptions(current.ru);

          box.innerHTML = "";

          options.forEach((opt) => {
            let b = document.createElement("button");
            b.className = "btn";
            b.innerText = opt;

            b.onclick = () => check(opt, b);

            box.appendChild(b);
          });
        }, 3000); // 3.0 сек после озвучки
      }
      function saveWord(word) {
        let tx = db.transaction("words", "readwrite");
        tx.objectStore("words").put(word);
      }
      function saveState() {
        if (!db) return;

        let tx = db.transaction("state", "readwrite");
        tx.objectStore("state").put(state);
      }
      function getWord() {
        let sourceWords = getCurrentWords();
        const unseen = sourceWords.filter((w) => (w.shown || 0) === 0);
        if (unseen.length > 0) {
          return unseen[Math.floor(Math.random() * unseen.length)];
        }

        if (sourceWords.length === 0) {
          return null;
        }

        let pool = [];

        sourceWords.forEach((w) => {
          for (let i = 0; i < w.weight; i++) {
            pool.push(w);
          }
        });

        let selected;

        do {
          selected = pool[Math.floor(Math.random() * pool.length)];
        } while (pool.length > 1 && selected.en === state.lastWord);

        state.lastWord = selected.en;

        saveState();

        return selected;
      }
      function loadState() {
        let tx = db.transaction("state", "readonly");

        let req = tx.objectStore("state").get("game");

        req.onsuccess = function () {
          if (req.result) {
            state = req.result;
          } else {
            saveState();
          }

          // 🔥 ОБЯЗАТЕЛЬНО обновляем интерфейс
          document.getElementById("score").innerText = state.score || 0;

          document.getElementById("topicLabel").innerText = getTopicName();

          loadOrCreateWords();
        };
      }

      function getCurrentWords() {
        let currentTopic = getCurrentTopic();

        if (currentTopic === "all") {
          return words;
        }

        return words.filter((word) => word.topic === currentTopic);
      }
      function getCurrentTopic() {
        return topics[state.currentTopicIndex];
      }
      // --------------------
      // ПРОВЕРКА
      // --------------------
      function check(answer, button) {
        let isCorrect = answer === current.ru;

        if (isCorrect) {
          state.score++;

          if (!hintUsed) {
            current.weight = Math.max(1, current.weight - 1);
          }

          saveState();
          saveWord(current);

          button.classList.add("correct");
        } else {
          current.errors++; // ← добавить

          current.weight = Math.min(10, current.weight + 1);

          button.classList.add("wrong");

          saveWord(current);
        }

        document.getElementById("score").innerText = state.score;

        document.querySelectorAll("#options .btn").forEach((b) => {
          b.disabled = true;
        });

        document.querySelectorAll("#options .btn").forEach((b) => {
          if (b.innerText === current.ru) {
            b.classList.add("correct");
          }
        });

        setTimeout(show, 2200);
      }

      // --------------------
      // АУДИО
      // --------------------
      function speak() {
        const utterance = new SpeechSynthesisUtterance(current.en);

        utterance.lang = "en-US";
        utterance.rate = 0.9;
        utterance.volume = 1;
        const voices = speechSynthesis.getVoices();

        const englishVoice = voices.find((v) => v.lang.includes("en"));

        if (englishVoice) {
          utterance.voice = englishVoice;
        }

        speechSynthesis.speak(utterance);
      }

      function initDB() {
        let request = indexedDB.open("EnglishCardsDB", 1);

        request.onupgradeneeded = function (event) {
          db = event.target.result;

          if (!db.objectStoreNames.contains("words")) {
            db.createObjectStore("words", { keyPath: "en" });
          }
          if (!db.objectStoreNames.contains("state")) {
            db.createObjectStore("state", { keyPath: "id" });
          }
        };

        request.onsuccess = function (e) {
          db = e.target.result;

          //console.log("Stores:", Array.from(db.objectStoreNames));

          loadState();
          loadOrCreateWords();
        };

        request.onerror = function () {
          console.log("Ошибка открытия БД");
        };
      }
      function loadOrCreateWords() {
        let tx = db.transaction("words", "readonly");
        let store = tx.objectStore("words");

        let request = store.getAll();

        request.onsuccess = function () {
          if (request.result.length === 0) {
            saveInitialWords();
          } else {
            words = request.result;

            show();
          }
        };
      }
      function saveInitialWords() {
        let tx = db.transaction("words", "readwrite");
        let store = tx.objectStore("words");

        words.forEach((word) => {
          store.put(word);
        });

        tx.oncomplete = function () {
          show();
        };
      }

      // старт
      function showDiagnostics() {
        let currentWords = getCurrentWords();

        let totalShown = currentWords.filter((w) => w.shown > 0).length;
        let neverShown = currentWords.filter((w) => w.shown === 0).length;

        let html = "";

        html += "<h2>Диагностика</h2>";

        html += "<p>";
        html += "Тема: " + getTopicName() + "<br/>";
        html += "Уникальных слов показано: " + totalShown + "<br/>";
        html += "Не показано ни разу: " + neverShown;
        html += "</p>";

        html += '<table border="1" cellpadding="5">';

        html += "<tr>";
        html += "<th>EN</th>";
        html += "<th>RU</th>";
        html += "<th>Вес</th>";
        html += "<th>Показов</th>";
        html += "<th>Ошибок</th>";
        html += "<th>Верно</th>";
        html += "</tr>";

        currentWords.forEach(function (w) {
          let success = w.shown - w.errors;

          html += "<tr>";
          html += "<td>" + w.en + "</td>";
          html += "<td>" + w.ru + "</td>";
          html += "<td>" + w.weight + "</td>";
          html += "<td>" + w.shown + "</td>";
          html += "<td>" + w.errors + "</td>";
          html += "<td>" + success + "</td>";
          html += "</tr>";
        });

        html += "</table>";

        let win = window.open("", "_blank");

        win.document.write(
          "<html><head><title>Диагностика</title></head><body>", );
        win.document.write(html);
        win.document.write("</body></html>");
      }
      initDB();
    </script>
  </body>
</html>
